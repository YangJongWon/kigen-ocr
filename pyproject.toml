[project]
name = "kigenocr"
version = "0.1.0"
description = "Tiny OCR for Japanese best-before / use-by dates on product packaging"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python-headless",
    "torch>=2.5",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "huggingface-hub>=2.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
